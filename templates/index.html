  // Custom status change handler (event delegation)
  document.addEventListener('change', function(e) {
    var sel = e.target.closest('.custom-status-select');
    if (!sel) return;
    var projectName = sel.getAttribute('data-status-project');
    var newStatus = sel.value;
    handleStatusChange(projectName, newStatus, sel);
  });

  function handleStatusChange(projectName, newStatus, sel) {
    if (newStatus === '待交付') {
      if (!confirm('将项目"' + projectName + '"设为"待交付"？\n\n系统会自动将交付文件夹（000交付）复制到该项目的根目录中。')) {
        sel.value = '';
        return;
      }
      showToast('正在设置状态并复制交付文件夹...');
    } else if (newStatus === '修改中') {
      var now = new Date();
      var mm = String(now.getMonth() + 1).padStart(2, '0');
      var dd = String(now.getDate()).padStart(2, '0');
      var folderName = mm + dd + '修改';
      if (!confirm('将项目"' + projectName + '"设为"修改中"？\n\n系统会在01上映单集版目录中新建文件夹: ' + folderName)) {
        sel.value = '';
        return;
      }
      showToast('正在设置状态并创建修改文件夹...');
    } else {
      showToast('正在更新状态...');
    }

    api('POST', '/api/project/' + encodeURIComponent(projectName) + '/custom_status', { status: newStatus }).then(function(data) {
      showToast(data.message || (data.ok ? '状态已更新' : '更新失败'));
      if (data.ok) {
        // Update select styling
        sel.className = 'custom-status-select status-' + newStatus;
        loadProjects();
      }
    }).catch(function() { showToast('操作失败'); });
  }

  // ========== Episode management ==========

  function saveEpisodes(projectName, btn) {
    var card = btn.closest('.episode-row');
    if (!card) return;
    var totalInput = card.querySelector('[data-field="total"]');
    var currentInput = card.querySelector('[data-field="current"]');
    var total = parseInt(totalInput.value) || 0;
    var current = parseInt(currentInput.value) || 0;

    showToast('正在保存集数...');
    api('POST', '/api/project/' + encodeURIComponent(projectName) + '/episodes', { total: total, current: current }).then(function(data) {
      if (data.ok) {
        showToast(data.message || '集数已保存');
        if (data.completed) {
          showToast('🎉 集数已完成！' + current + '/' + total + ' 集全部输出');
          // Also try browser notification
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('集数完成提醒', { body: projectName + ' 已完成全部 ' + total + ' 集输出！' });
          }
        }
        loadProjects();
      } else {
        showToast(data.message || '保存失败');
      }
    }).catch(function() { showToast('操作失败'); });
  }

  function autoCountEpisodes(projectName, btn) {
    showToast('正在统计成片文件...');
    api('GET', '/api/project/' + encodeURIComponent(projectName) + '/auto_count').then(function(data) {
      if (!data.ok) { showToast('统计失败'); return; }
      var count = data.count;
      var card = btn.closest('.episode-row');
      var total = 0;
      if (card) {
        var currentInput = card.querySelector('[data-field="current"]');
        var totalInput = card.querySelector('[data-field="total"]');
        if (currentInput) currentInput.value = count;
        total = totalInput ? (parseInt(totalInput.value) || 0) : 0;
      }

      // 先把集数持久化到 DB（这是原本漏掉的环节）
      api('POST', '/api/project/' + encodeURIComponent(projectName) + '/episodes', {
        total: total || 0,
        current: count
      }).then(function() {
        var proj = findProject(projectName);
        if (proj) {
          proj.current_episodes = count;
          if (total > 0) proj.total_episodes = total;
        }
        showToast('统计到 ' + count + ' 个成片文件');

        // 剪辑中项目 + 集数已达标 → 自动询问初版交付
        if (proj && proj.custom_status === '剪辑中' && total > 0 && count >= total) {
          var progressRow = document.querySelector(
            '.episode-row[data-ep-project="' + projectName.replace(/"/g, '&quot;') + '"]');
          if (confirm('🎉 集数已达标！\n\n当前 ' + count + ' / 目标 ' + total + ' 集\n\n是否一键进行「初版交付」？\n（交付完成后项目自动变为"审核中"）')) {
            startDeliverInitial(projectName, progressRow);
          }
        }
      }).catch(function() { showToast('集数保存失败'); });
    }).catch(function() { showToast('操作失败'); });
  }

  // ---- episode summary (shows missing list + responsible person on each card) ----
  // 缓存每个项目最近一次 episodes_status，避免重复请求
  var _episodeStatusCache = {};
  var _episodeStatusPending = {};

  function loadAllEpisodeSummary() {
    if (!allData || !allData.projects) return;
    var names = [];
    for (var i = 0; i < allData.projects.length; i++) {
      var p = allData.projects[i];
      if ((p.custom_status || '') === '剪辑中' && p.project_type !== 'production') {
        names.push(p.name);
      }
    }
    for (var j = 0; j < names.length; j++) {
      fetchEpisodeStatus(names[j]);
    }
  }

  function fetchEpisodeStatus(projectName) {
    if (_episodeStatusPending[projectName]) return _episodeStatusPending[projectName];
    _episodeStatusPending[projectName] = api('GET', '/api/project/' + encodeURIComponent(projectName) + '/episodes_status')
      .then(function(data) {
        if (data && data.ok) _episodeStatusCache[projectName] = data;
        updateCardEpisodeSummary(projectName, data);
        return data;
      }).catch(function() {
        updateCardEpisodeSummary(projectName, { ok: false });
      }).then(function(data) {
        delete _episodeStatusPending[projectName];
        return data;
      });
    return _episodeStatusPending[projectName];
  }

  function updateCardEpisodeSummary(projectName, data) {
    var box = document.querySelector('.ep-missing-summary[data-ep-summary="' + projectName.replace(/"/g, '\\"') + '"]');
    if (!box) return;
    if (!data || !data.ok) {
      box.className = 'ep-missing-summary';
      box.textContent = '（无法获取集数状态）';
      return;
    }
    var total = data.total || 0;
    var missing = data.missing || [];
    var unnamed = data.unnamed || [];
    var plan = data.editor_plan || {};

    if (total === 0) {
      box.className = 'ep-missing-summary';
      box.innerHTML = '请先设置「总集数」，再点「统计」识别文件';
      return;
    }
    if (missing.length === 0) {
      box.className = 'ep-missing-summary ok';
      var detailHint = total > 0 ? ' <button class="ep-detail-btn" data-action="ep-detail" data-project="' + htm(projectName) + '">详情</button>' : '';
      box.innerHTML = '✅ ' + (data.current_count || 0) + '/' + total + ' 集 全部输出完成' + detailHint;
      return;
    }

    // 有缺失：把每集负责人拼出来
    var namedMissing = [];
    for (var i = 0; i < missing.length; i++) {
      var ep = missing[i];
      var creator = plan[String(ep)] || plan[ep] || null;
      namedMissing.push({ ep: ep, creator: creator });
    }
    var missingNumsHtml = namedMissing.map(function(x) {
      var suffix = x.creator ? ' <small style="color:#6b6b70">(' + htm(x.creator) + ')</small>' : '';
      return '<span style="margin-right:6px">' + String(x.ep).padStart(2, '0') + suffix + '</span>';
    }).join('');
    var unassigned = namedMissing.filter(function(x) { return !x.creator; }).length;
    var tip = '缺 ' + missing.length + '/' + total + ' 集';
    if (unassigned > 0) tip += '（' + unassigned + ' 集未分配剪辑）';
    var extra = '';
    if (unnamed && unnamed.length > 0) {
      extra = '<span class="ep-missing-creator">另有 ' + unnamed.length + ' 个文件未识别集号</span>';
    }
    box.className = 'ep-missing-summary has-missing';
    box.innerHTML = '<b>' + tip + '</b><div class="ep-missing-nums">' + missingNumsHtml + '</div>'
      + extra
      + '<button class="ep-detail-btn" data-action="ep-detail" data-project="' + htm(projectName) + '">详情/分配人员</button>';
  }

    // 表头

      + '<div class="ep-col-head">集号</div><div class="ep-col-head">状态</div><div class="ep-col-head">剪辑人员</div>';

    // 完整渲染 1..total；无 total 时仅渲染 present + missing 里的集号

    } else {

    for (var j = 0; j < nums.length; j++) {

        + '<div class="ep-status ' + (isMissing ? 'missing' : 'ok') + '">' + (isMissing ? '未输出' : '已输出 ✅') + '</div>'
        + '<input class="ep-creator-input' + (isMissing ? ' missing-creator' : '') + '" data-ep="' + n + '" placeholder="' + (isMissing ? '请填剪辑人员' : '可填可不填') + '" value="' + htm(val) + '">';
    }
    grid += '</div>';

    var unnamedHtml = '';
    if (unnamed.length > 0) {
      var list = unnamed.slice(0, 20).map(function(n) { return '<code>' + htm(n) + '</code>'; }).join('<br>');
      var more = unnamed.length > 20 ? '<br>…还有 ' + (unnamed.length - 20) + ' 个' : '';
      unnamedHtml = '<div style="margin-top:12px;font-size:12px;color:#86868b">⚠️ 以下 ' + unnamed.length + ' 个文件未能识别集号：<br>' + list + more + '</div>';
    }

    body.innerHTML =
      '<div class="ep-detail-header">'
        + '<div class="ep-detail-stat">总集数 <b>' + total + '</b></div>'
        + '<div class="ep-detail-stat">已输出 <b style="color:#137333">' + present.length + '</b></div>'
        + '<div class="ep-detail-stat">缺失 <b style="color:#c5221f">' + missing.length + '</b></div>'
        + '<div class="ep-detail-stat">成片文件 <b>' + currentCount + '</b></div>'
      + '</div>'
      + '<div class="ep-batch-bar">'
        + '<button type="button" class="btn btn-secondary btn-sm" id="ep-batch-toggle">📋 批量粘贴分配表</button>'
        + '<span class="ep-batch-hint" style="display:none;color:#86868b;font-size:12px;margin-left:8px">格式：姓名:起始-结束，每行一条（支持中英文冒号、波浪号、逗号混合）</span>'
      + '</div>'
      + '<textarea id="ep-batch-input" class="ep-batch-input" placeholder="任显翔：1-4&#10;陈陆杰：5-9&#10;陈春阳：10-15&#10;程梦：16-21&#10;..."></textarea>'
      + '<div class="ep-batch-actions" style="display:none">'
        + '<button type="button" class="btn btn-primary btn-sm" id="ep-batch-apply">应用到表格</button>'
        + '<span id="ep-batch-apply-result" style="margin-left:8px;font-size:12px"></span>'
      + '</div>'
      + (nums.length === 0 ? '<div class="ep-detail-no-plan-hint">暂无可显示的集号。先在卡片上点「统计」识别成片文件。</div>' : '')
      + grid
      + unnamedHtml
      + '<div class="ep-detail-footer">'

    document.getElementById('ep-detail-close').addEventListener('click', closeModal);
    document.getElementById('ep-detail-save').addEventListener('click', function() {
      saveEpisodePlan(projectName);

    // Toggle batch paste area

    var batchInput = document.getElementById('ep-batch-input');
    var batchActions = document.querySelector('.ep-batch-actions');

    batchToggle.addEventListener('click', function() {

      batchInput.style.display = show ? 'block' : 'none';

  // Parse flexible batch text like:
  //   任显翔：1-4
  //   陈陆杰:5~9
  //   张三 10-12, 15
  //   李四 13, 14, 16-18
  function parseBatchEditorPlan(text) {
    var plan = {};
    var lines = (text || '').split(/\r?\n/);
    var lineRe = /^(.+?)\s*[:：]\s*(.+?)\s*$/;
    lines.forEach(function(raw) {
      var line = raw.trim();
      if (!line) return;
      // Try "name: range" first
      var m = line.match(lineRe);
      var name, rangeStr;
      if (m) {
        name = m[1].trim();
        rangeStr = m[2].trim();
      } else {
        // Fallback: last whitespace-separated token(s) as range, rest as name
        var idx = line.search(/\d/);
        if (idx <= 0) return;
        name = line.substring(0, idx).trim().replace(/[:：]$/, '').trim();
        rangeStr = line.substring(idx).trim();
      }
      if (!name || !rangeStr) return;
      // Expand ranges like "1-4", "5~9", "10,11,13-15"
      var tokens = rangeStr.split(/[，,、\s]+/).filter(Boolean);
      tokens.forEach(function(tok) {
        var rng = tok.match(/^(\d{1,4})\s*[-~到至]\s*(\d{1,4})$/);
        if (rng) {
          var a = parseInt(rng[1], 10), b = parseInt(rng[2], 10);
          if (a > b) { var tmp = a; a = b; b = tmp; }
          for (var n = a; n <= b; n++) plan[String(n)] = name;
        } else {
          var single = tok.match(/^(\d{1,4})$/);
          if (single) plan[String(single[1])] = name;
        }
      });
    });
    return plan;
  }

  // Fill all .ep-creator-input with values from plan object
  function applyBatchEditorPlan(plan) {
    var inputs = document.querySelectorAll('#modal-body .ep-creator-input');
    var matched = 0;
    for (var i = 0; i < inputs.length; i++) {
      var ep = inputs[i].getAttribute('data-ep');
      if (plan[String(ep)] !== undefined) {
        inputs[i].value = plan[String(ep)];
        matched++;
      }
    }
    var summary = document.getElementById('ep-batch-apply-result');
    var totalKeys = Object.keys(plan).length;
    summary.textContent = '✅ 已填 ' + matched + ' 集，共解析 ' + totalKeys + ' 条分配；记得点右下角「保存剪辑人员」持久化。';
    summary.style.color = '#137333';
    // flash briefly — scroll to top of grid
    var grid = document.querySelector('.ep-detail-grid');
    if (grid) grid.scrollTop = 0;
  }

  function saveEpisodePlan(projectName) {
    var inputs = document.querySelectorAll('#modal-body .ep-creator-input');
    var plan = {};
    for (var i = 0; i < inputs.length; i++) {
      var ep = inputs[i].getAttribute('data-ep');
      var val = (inputs[i].value || '').trim();
      if (val) plan[String(ep)] = val;

    showToast('正在保存剪辑人员分配...');
    api('POST', '/api/project/' + encodeURIComponent(projectName) + '/episodes_plan', { plan: plan }).then(function(data) {

        showToast(data.message || '已保存');

        delete _episodeStatusCache[projectName];
        fetchEpisodeStatus(projectName);

        showToast(data.message || '保存失败');

    }).catch(function() { showToast('保存失败，请检查网络'); });
  }

  var _deliverPollingTimers = {};

  function startDeliver(projectName, btn) {
    if (!confirm('确认一键交付？\n\n将把组内NAS项目下的「000交付」整个复制到制作部NAS对应项目。')) return;

    btn.disabled = true;
    btn.textContent = '准备中...';

    var row = btn.closest('.card-delivery-row');
    if (row) {
      // 显示交付进度条区域，隐藏其他按钮
      var progressArea = row.querySelector('.card-delivery-progress');
      if (progressArea) progressArea.style.display = 'block';
      row.querySelectorAll('.delivery-refresh-btn, .deliver-btn').forEach(function(b) { b.style.display = 'none'; });
    }

    api('POST', '/api/project/' + encodeURIComponent(projectName) + '/deliver').then(function(data) {
      if (data.ok) {
        showToast('交付已启动：' + data.message);
        startDeliverPolling(projectName, row);
      } else {
        showToast('启动失败：' + data.message);
        if (row) {
          var progressArea = row.querySelector('.card-delivery-progress');
          if (progressArea) progressArea.style.display = 'none';
          row.querySelectorAll('.delivery-refresh-btn, .deliver-btn').forEach(function(b) { b.style.display = ''; });
        }
        btn.disabled = false;
        btn.textContent = '🚀 一键交付';
      }
    }).catch(function() {
      showToast('启动失败');
      btn.disabled = false;
      btn.textContent = '🚀 一键交付';
    });
  }

  function startDeliverPolling(projectName, row) {
    if (_deliverPollingTimers[projectName]) return;

    var pctEl = row ? row.querySelector('.card-dp-fill') : null;
    var textEl = row ? row.querySelector('.card-dp-text') : null;

    _deliverPollingTimers[projectName] = setInterval(function() {
      api('GET', '/api/project/' + encodeURIComponent(projectName) + '/deliver_status').then(function(data) {
        if (!data.ok) return;
        var st = data.status;
        if (!row) return;

        if (st.status === 'starting') {
          if (textEl) textEl.textContent = '正在准备...';
          return;
        }
        if (st.status === 'running') {
          var pct = st.pct || 0;
          var cur = st.current || 0;
          var total = st.total || 0;
          if (pctEl) pctEl.style.width = pct + '%';
          if (textEl) textEl.textContent = '正在复制... ' + cur + '/' + total + ' (' + pct + '%)';
          return;
        }
        if (st.status === 'done') {
          clearInterval(_deliverPollingTimers[projectName]);
          delete _deliverPollingTimers[projectName];
          if (pctEl) { pctEl.style.width = '100%'; pctEl.style.background = '#34c759'; }
          var dstPath = st.dst || '';
          if (textEl) textEl.textContent = '✅ 交付完成（' + st.finished_at + '）';
          showToast('🎉 一键交付完成！');
          if (dstPath) {
            copyToClipboard(dstPath);
            showToast('📋 交付路径已复制: ' + dstPath);
          }
          setTimeout(function() { loadProjects(); }, 1500);
          return;
        }
        if (st.status === 'error') {
          clearInterval(_deliverPollingTimers[projectName]);
          delete _deliverPollingTimers[projectName];
          if (pctEl) pctEl.style.background = '#ff3b30';
          if (textEl) textEl.textContent = '❌ ' + (st.message || '交付失败');
          showToast('交付失败：' + (st.message || '未知错误'));
          return;
        }
      }).catch(function() {});
    }, 1500);
  }

  function showPathsModal() {

  function closePathsModal() {

  function loadPaths() {
    api('GET', '/api/config/paths').then(function(data) {
      if (!data.ok) { showToast('加载路径失败'); return; }

      // Production roots
      var prodList = document.getElementById('prod-paths-list');
      var roots = data.production_roots || [];
      var labels = data.production_labels || {};
      if (!roots.length) {
        prodList.innerHTML = '<div style="font-size:12px;color:#86868b;padding:8px 0">暂无制作部路径</div>';
      } else {
        var html = '';
        for (var i = 0; i < roots.length; i++) {
          var r = roots[i];
          var lbl = labels[r] || '';
          html += '<div class="path-item">'
            + '<span class="path-item-path">' + htm(r) + '</span>'
            + (lbl ? '<span class="path-item-label">' + htm(lbl) + '</span>' : '')
            + '<button class="btn-danger-sm" data-del-type="production" data-del-path="' + htm(r) + '">删除</button>'
            + '</div>';
        }
        prodList.innerHTML = html;
      }

      // Group root
      var gr = data.group_root || '';
      document.getElementById('group-root-row').innerHTML =
        '<span class="label">当前：</span>' + (gr ? htm(gr) : '<span style="color:#ff3b30">未配置</span>');

      // UNC map
      var uncList = document.getElementById('unc-paths-list');
      var uncMap = data.unc_map || {};
      var uncKeys = Object.keys(uncMap);
      if (!uncKeys.length) {
        uncList.innerHTML = '<div style="font-size:12px;color:#86868b;padding:8px 0">暂无 UNC 映射</div>';
      } else {
        var uhtml = '';
        for (var j = 0; j < uncKeys.length; j++) {
          var dk = uncKeys[j];
          uhtml += '<div class="path-item">'
            + '<span class="path-item-path">' + htm(dk) + ' &rarr; ' + htm(uncMap[dk]) + '</span>'
            + '<button class="btn-danger-sm" data-del-type="unc" data-del-drive="' + htm(dk) + '">删除</button>'
            + '</div>';
        }
        uncList.innerHTML = uhtml;
      }
    }).catch(function() { showToast('加载路径失败'); });
  }

        loadPaths();
      } else { showToast(data.message); }
    }).catch(function() { showToast('操作失败'); });
  }

  function removePath(type, key) {
    if (type === 'production') {
      api('DELETE', '/api/config/paths', { type: 'production', path: key }).then(function(data) {
        showToast(data.ok ? data.message : data.message);
        if (data.ok) loadPaths();
      }).catch(function() { showToast('操作失败'); });
    } else if (type === 'unc') {
      api('DELETE', '/api/config/paths', { type: 'unc', drive: key }).then(function(data) {
        showToast(data.ok ? data.message : data.message);
        if (data.ok) loadPaths();
      }).catch(function() { showToast('操作失败'); });
    }
  }

  // Event delegation for path modal delete buttons
  document.getElementById('paths-modal').addEventListener('click', function(e) {
    if (e.target === this || e.target.id === 'paths-modal-close') { closePathsModal(); return; }
    var delBtn = e.target.closest('[data-del-type]');
    if (delBtn) {
      var dtype = delBtn.getAttribute('data-del-type');
      if (dtype === 'production') {
        removePath('production', delBtn.getAttribute('data-del-path'));
      } else if (dtype === 'unc') {
        removePath('unc', delBtn.getAttribute('data-del-drive'));
      }
    }
  });

  document.getElementById('btn-paths').addEventListener('click', showPathsModal);
  document.getElementById('btn-paths-done').addEventListener('click', function() {
    closePathsModal();
    showToast('正在刷新项目...');
    loadProjects();
  });
  document.getElementById('btn-add-prod').addEventListener('click', addProdPath);
  document.getElementById('btn-set-group').addEventListener('click', setGroupPath);
  document.getElementById('btn-add-unc').addEventListener('click', addUncPath);

  // ========== Logs & status ==========

  function loadLogs() {
    api('GET', '/api/logs?limit=50').then(function(logs) {
      var container = document.getElementById('logs');
      if (!logs.length) {
        container.innerHTML = '<div class="loading">暂无日志</div>';
        return;
      }
      var html = '';
      for (var i = 0; i < logs.length; i++) {
        var l = logs[i];
        var typeText = l.type === 'sync' ? '同步' : '交付';
        html += '<div class="log-item">'
          + '<span class="log-time">' + htm(l.created_at) + '</span>'
          + '<span class="log-type log-type-' + l.type + '">' + typeText + '</span>'
          + '<span class="log-project" title="' + htm(l.project_name) + '">' + htm(l.project_name) + '</span>'
          + '<span class="log-message ' + htm(l.status) + '">' + htm(l.title) + ' - ' + htm(l.message) + '</span>'
          + '</div>';
      }
      container.innerHTML = html;
    }).catch(function() {});
  }

  function loadStatus() {
    api('GET', '/api/status').then(function(status) {
      var dot = document.getElementById('watcher-dot');
      var text = document.getElementById('watcher-status');
      if (status.watcher_enabled) {
        text.textContent = '监听中 (' + status.watched_dirs + '个目录)';
        dot.classList.remove('offline');
      } else {
        text.textContent = '监听已禁用';
        dot.classList.add('offline');
      }
    }).catch(function() {});
  }

  // 加载超时检测
  var loadTimeout = setTimeout(function() {
    var el = document.getElementById('project-sections');
    if (el && el.innerHTML.indexOf('加载中') !== -1) {
      el.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>' +
        '<div>加载超时，正在重试...</div>' +
        '<div style="font-size:12px;margin-top:8px;color:#86868b">如持续加载不出来，请按 Ctrl+F5 强制刷新</div></div>';
      loadProjects();
    }
  }, 10000);

  loadProjects();
  loadLogs();
  loadStatus();
  setInterval(function() { loadProjects(); loadLogs(); loadStatus(); }, 8000);
</script>
</body>
</html>
